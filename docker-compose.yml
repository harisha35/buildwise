services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildwise
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BUILDWISE_ENVIRONMENT: development
      BUILDWISE_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/buildwise
      BUILDWISE_SECRET_KEY: change-me-in-production
      BUILDWISE_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      BUILDWISE_REFRESH_TOKEN_EXPIRE_DAYS: 7
      BUILDWISE_STORAGE_DIR: /app/storage_data
      BUILDWISE_TIMEZONE: Asia/Kolkata
      BUILDWISE_CORS_ORIGINS: '["http://localhost:3000"]'
      BUILDWISE_FRONTEND_BASE_URL: http://localhost:3000
    volumes:
      - backend_storage:/app/storage_data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  db_data:
  backend_storage:
